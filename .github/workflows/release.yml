name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.rid }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            asset: gh-ledger-windows-amd64.exe
            smoke: true
          - os: windows-latest
            rid: win-arm64
            asset: gh-ledger-windows-arm64.exe
            smoke: false
          - os: ubuntu-latest
            rid: linux-x64
            asset: gh-ledger-linux-amd64
            smoke: true
          - os: ubuntu-latest
            rid: linux-arm64
            asset: gh-ledger-linux-arm64
            smoke: false
          - os: macos-latest
            rid: osx-x64
            asset: gh-ledger-darwin-amd64
            smoke: false
          - os: macos-latest
            rid: osx-arm64
            asset: gh-ledger-darwin-arm64
            smoke: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Check the version
        shell: bash
        run: |
          version=$(dotnet msbuild src/CopilotLedger.Cli/CopilotLedger.Cli.csproj -getProperty:Version | tr -d '\r')
          echo "Project version: $version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the project version $version."
            exit 1
          fi
      - name: Publish
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: dotnet publish src/CopilotLedger.Cli/CopilotLedger.Cli.csproj -c Release -r "$RID" -o publish
      - name: Name the asset
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir dist
          if [ -f publish/gh-ledger.exe ]; then
            cp publish/gh-ledger.exe "dist/$ASSET"
          else
            cp publish/gh-ledger "dist/$ASSET"
          fi
      - name: Smoke-test the asset
        if: matrix.smoke
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          version=$(dotnet msbuild src/CopilotLedger.Cli/CopilotLedger.Cli.csproj -getProperty:Version | tr -d '\r')
          test "$("./dist/$ASSET" --version | tr -d '\r')" = "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check ratesVersion against the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern rates.v2.json --dir latest; then
            published=latest/rates.v2.json
          elif gh release download --repo "$GITHUB_REPOSITORY" --pattern rates.json --dir latest; then
            published=latest/rates.json
          else
            echo "Skipping the check: no rates were downloaded from the latest release."
            exit 0
          fi
          current=src/CopilotLedger.Core/Pricing/rates.json
          old=$(jq -r .ratesVersion "$published")
          new=$(jq -r .ratesVersion "$current")
          if cmp -s <(jq -S . "$published") <(jq -S . "$current"); then
            echo "rates.json is unchanged since the latest release ($old)."
          elif [[ "$new" > "$old" ]]; then
            echo "rates.json changed since the latest release; ratesVersion moves from $old to $new."
          else
            echo "::error::rates.json changed since the latest release, but its ratesVersion $new isn't later than $old. Set ratesVersion to the date of the change."
            exit 1
          fi

  release:
    needs: [build, rates]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Add the rates and checksums
        run: |
          rates=src/CopilotLedger.Core/Pricing/rates.json
          test "$(jq .schemaVersion "$rates")" = 2
          cp "$rates" dist/rates.v2.json
          jq '.schemaVersion = 1 | del(.apiEquivalent)' "$rates" > dist/rates.json
          cd dist
          sha256sum gh-ledger-* rates.json rates.v2.json > gh-ledger-checksums.txt
          cat gh-ledger-checksums.txt
      - name: Attest the binaries and rates
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/gh-ledger-windows-amd64.exe
            dist/gh-ledger-windows-arm64.exe
            dist/gh-ledger-linux-amd64
            dist/gh-ledger-linux-arm64
            dist/gh-ledger-darwin-amd64
            dist/gh-ledger-darwin-arm64
            dist/rates.json
            dist/rates.v2.json
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "gh-ledger $GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
