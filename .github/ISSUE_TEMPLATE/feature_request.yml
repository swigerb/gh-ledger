name: Feature request
description: Suggest a way gh-ledger could do more for you.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do, and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What gh-ledger could do. It stays local, needs no Docker or cloud service, and never stores prompt or response content.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Optional. Other ways you've tried or considered.
